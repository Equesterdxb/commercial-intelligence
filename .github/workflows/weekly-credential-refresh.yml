name: Weekly Credential Refresh

on:
  schedule:
    # Runs every Monday at 2:00 AM UTC (6:00 AM Dubai Time)
    - cron: '0 2 * * 1'
  # Allow manual trigger
  workflow_dispatch:

jobs:
  refresh-credentials:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install python-dotenv requests

      - name: Create .env from secrets
        run: |
          cat > .env << EOF
          GOOGLE_ADS_CLIENT_ID=${{ secrets.GOOGLE_ADS_CLIENT_ID }}
          GOOGLE_ADS_CLIENT_SECRET=${{ secrets.GOOGLE_ADS_CLIENT_SECRET }}
          GOOGLE_ADS_REFRESH_TOKEN=${{ secrets.GOOGLE_ADS_REFRESH_TOKEN }}
          EOF

      - name: Run credential refresh
        run: python scripts/refresh_credentials.py

      - name: Create reminder issue for Meta token
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '🔄 Weekly: Refresh Meta app token',
              body: '## Meta Token Refresh Reminder\n\nMeta app tokens expire after 1-2 days.\n\n### Steps:\n1. Go to https://developers.facebook.com/tools/explorer\n2. Select "Equester" app\n3. Click "Get App Token"\n4. Copy the token\n5. Update `.env`: `META_ACCESS_TOKEN=<token>`\n6. Commit and push\n\n**When:** Every Monday morning (Dubai time)\n**Priority:** Medium - blocks Meta Ads collector'
            })
